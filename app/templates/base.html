<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Remittance Stub Parser{% endblock %} — Lailara LLC</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/htmx-ext-sse.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="brand">
                <span class="brand-name">Lailara LLC</span>
                <span class="brand-subtitle">Data Hygiene &amp; Analytics</span>
            </a>
        </div>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p>Built by <a href="https://lailarallc.com">Lailara LLC</a> &mdash; data hygiene and analytics consulting for specialty food brands scaling into national retail.</p>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
